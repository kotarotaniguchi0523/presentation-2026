name: Lint workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# 3 つとも数秒で終わるので、job を分けずに 1 つの runner で順に流す。
# 分けると checkout と runner の起動を 3 回払うことになる。
# 速く終わるものから並べて、落ちたらそこで止める。
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # betterleaks が履歴全体を見る
          fetch-depth: 0

      - name: jactionlint
        uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0

      - name: Install betterleaks
        env:
          VERSION: 1.9.0
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}"
          curl -fsSLO "${base}/betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/checksums.txt"
          grep "betterleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "betterleaks_${VERSION}_linux_x64.tar.gz" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks --version

      # 履歴も含めて、秘密情報が入っていないかを見る
      - name: betterleaks
        run: betterleaks git .

      # Node は 24 系の固定。キャッシュの判定も lockfile だけを見る
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: package-lock.json
          check-latest: false

      - run: npm ci

      # vite build は型を捨てるだけで検査しない。tsrs で型を見る
      - name: typecheck
        run: npm run check
